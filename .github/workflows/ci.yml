name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck & Unit Specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Strict typecheck
        run: npm run typecheck

      - name: Run lock-preflight spec
        run: npx tsx template/scripts/lock-preflight.test.mts

      - name: Run skills-map spec
        run: npx tsx template/scripts/skills-map.test.mts

      - name: Run sync-template spec
        run: npx tsx template/scripts/sync-template.test.mts

  smoke-test:
    name: Distributable Fixture Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run fixture smoke test
        run: npx tsx scripts/smoke-test-fixture.mts
